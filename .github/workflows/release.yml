name: Release userscript

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v1.1.3'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release metadata
        run: |
          version="${RELEASE_TAG#v}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/inskewl.user.js"

          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "UPDATE_URL=$release_url" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=$release_url" >> "$GITHUB_ENV"

      - name: Build userscript
        run: npm run build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            ./dist/inskewl.user.js \
            --draft \
            --title "$RELEASE_TAG" \
            --notes "Automatic release of $RELEASE_TAG" \
            --verify-tag
